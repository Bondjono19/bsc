services:
  redis:
    image: "redis:7-alpine"
    restart: always
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli" ,"-a", "{REDIS_PASSWORD}","ping"]
      interval: 2s
      timeout: 3s
      retries: 10