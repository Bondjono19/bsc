services:
  app:
    build:
      context: ./../
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PYTHONUNBUFFERED=1
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - ../:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  redis:
    image: "redis:alpine"
    restart: always
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
  redis-monitor:
      image: "redis:alpine"
      depends_on:
        - redis
      environment:
        - REDISCLI_AUTH=${REDIS_PASSWORD}
      command: redis-cli -h redis PSUBSCRIBE '*'

